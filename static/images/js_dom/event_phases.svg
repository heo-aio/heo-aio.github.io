<svg viewBox="0 0 700 560" xmlns="http://www.w3.org/2000/svg" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">
  <rect x="0" y="0" width="700" height="560" fill="#F9FAFB"/>
  <text x="30" y="35" font-size="17" font-weight="700" fill="#1F2937">이벤트 전파 3단계 - 캡처링 → 타겟 → 버블링</text>

  <!-- nested boxes -->
  <rect x="60" y="60" width="580" height="380" rx="12" fill="#FEE2E2" stroke="#DC2626" stroke-width="2"/>
  <text x="80" y="88" font-size="14" font-weight="700" fill="#991B1B">#parent_1 (window에서 시작)</text>

  <rect x="100" y="105" width="500" height="300" rx="12" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
  <text x="120" y="130" font-size="14" font-weight="700" fill="#92400E">#parent_2</text>

  <rect x="140" y="150" width="420" height="220" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  <text x="160" y="175" font-size="14" font-weight="700" fill="#065F46">#parent_3</text>

  <rect x="255" y="228" width="190" height="60" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2.5"/>
  <text x="350" y="264" font-size="14" font-weight="700" fill="#3730A3" text-anchor="middle">button#btn</text>

  <!-- capturing arrow (left, down) -->
  <path d="M 100 90 C 100 150, 150 200, 270 250" fill="none" stroke="#4F46E5" stroke-width="2.5" marker-end="url(#down)"/>
  <text x="70" y="440" font-size="13" fill="#4F46E5" font-weight="700">① 캡처링 (eventPhase=1)</text>
  <text x="70" y="458" font-size="12" fill="#6B7280">window → parent_1 → parent_2 → parent_3 순서로 내려옴</text>
  <text x="70" y="474" font-size="12" fill="#6B7280">(3번째 인자 true로 등록해야 이 단계에서 잡힌다)</text>

  <!-- target -->
  <text x="350" y="203" font-size="12.5" fill="#3730A3" font-weight="700" text-anchor="middle">② 타겟 (eventPhase=2)</text>
  <text x="350" y="219" font-size="11.5" fill="#6B7280" text-anchor="middle">클릭 지점 btn에서 실행</text>

  <!-- bubbling arrow (right, up) -->
  <path d="M 430 260 C 500 230, 560 150, 600 90" fill="none" stroke="#DC2626" stroke-width="2.5" marker-end="url(#up)"/>
  <text x="420" y="500" font-size="13" fill="#DC2626" font-weight="700">③ 버블링 (eventPhase=3)</text>
  <text x="420" y="518" font-size="12" fill="#6B7280">btn → parent_3 → parent_2 → parent_1 순서로 올라감</text>
  <text x="420" y="534" font-size="12" fill="#6B7280">(addEventListener 3번째 인자 생략/false가 기본값)</text>

  <defs>
    <marker id="down" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#4F46E5"/></marker>
    <marker id="up" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#DC2626"/></marker>
  </defs>
</svg>
