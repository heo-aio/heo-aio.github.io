<svg viewBox="0 0 700 520" xmlns="http://www.w3.org/2000/svg" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">
  <rect x="0" y="0" width="700" height="520" fill="#F9FAFB"/>

  <!-- 전역 스코프 -->
  <rect x="20" y="20" width="660" height="480" rx="12" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
  <text x="40" y="50" font-size="17" font-weight="700" fill="#3730A3">전역 스코프 (global scope)</text>
  <text x="40" y="76" font-size="14" fill="#312E81">const global = 10;</text>

  <!-- outerFunc 스코프 -->
  <rect x="60" y="100" width="580" height="370" rx="12" fill="#ECFDF5" stroke="#10B981" stroke-width="2"/>
  <text x="80" y="130" font-size="16" font-weight="700" fill="#047857">outerFunc() 스코프</text>
  <text x="80" y="155" font-size="14" fill="#065F46">const global = 20;</text>
  <text x="80" y="176" font-size="14" fill="#065F46">const local1 = 10;</text>

  <!-- innerFunc 스코프 -->
  <rect x="110" y="205" width="480" height="220" rx="12" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
  <text x="130" y="235" font-size="16" font-weight="700" fill="#92400E">innerFunc() 스코프</text>
  <text x="130" y="260" font-size="14" fill="#78350F">const local1 = 40;</text>
  <text x="130" y="281" font-size="14" fill="#78350F">const local2 = 50;</text>

  <rect x="130" y="300" width="440" height="34" rx="6" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5"/>
  <text x="145" y="322" font-size="13.5" fill="#92400E">console.log(global)  ← innerFunc 안에는 global이 없다!</text>

  <!-- 화살표: innerFunc -> outerFunc 로 검색 -->
  <path d="M 350 300 C 350 260, 350 220, 350 176" fill="none" stroke="#DC2626" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <text x="365" y="230" font-size="13" fill="#DC2626" font-weight="600">① innerFunc에 없음</text>
  <text x="365" y="248" font-size="13" fill="#DC2626" font-weight="600">→ 바로 바깥(outerFunc)으로 검색</text>

  <rect x="355" y="150" width="150" height="30" rx="6" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
  <text x="365" y="170" font-size="13" fill="#065F46" font-weight="700">② 여기서 발견: 20</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#DC2626"/>
    </marker>
  </defs>

  <!-- 하단 규칙 요약 -->
  <rect x="60" y="450" width="580" height="0" fill="none"/>
  <text x="350" y="500" font-size="14" fill="#374151" text-anchor="middle" font-weight="600">
    규칙: 가까운 스코프부터 검색 → 없으면 한 단계씩 바깥으로 → 전역까지 못 찾으면 에러
  </text>
</svg>
