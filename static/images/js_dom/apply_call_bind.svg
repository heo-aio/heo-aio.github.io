<svg viewBox="0 0 760 400" xmlns="http://www.w3.org/2000/svg" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">
  <rect x="0" y="0" width="760" height="400" fill="#F9FAFB"/>
  <text x="30" y="36" font-size="17" font-weight="700" fill="#1F2937">apply vs call vs bind - this를 바꾸는 세 가지 방법</text>

  <!-- apply -->
  <rect x="30" y="65" width="220" height="180" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
  <text x="46" y="92" font-size="14" font-weight="700" fill="#3730A3">apply</text>
  <text x="46" y="116" font-size="11" font-family="monospace" fill="#4338CA">addArgs.apply(</text>
  <text x="56" y="134" font-size="11" font-family="monospace" fill="#4338CA">hellobit, [1, 2])</text>
  <text x="46" y="160" font-size="11.5" fill="#3730A3">인자를 배열(Array)로 묶어 전달</text>
  <text x="46" y="182" font-size="11.5" fill="#3730A3" font-weight="700">즉시 실행됨</text>
  <text x="46" y="204" font-size="10.5" fill="#6B7280">apply → Array 연상</text>

  <!-- call -->
  <rect x="270" y="65" width="220" height="180" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  <text x="286" y="92" font-size="14" font-weight="700" fill="#065F46">call</text>
  <text x="286" y="116" font-size="11" font-family="monospace" fill="#047857">addArgs.call(</text>
  <text x="296" y="134" font-size="11" font-family="monospace" fill="#047857">caterpillar, 3, 4)</text>
  <text x="286" y="160" font-size="11.5" fill="#065F46">인자를 콤마(,)로 나열해 전달</text>
  <text x="286" y="182" font-size="11.5" fill="#065F46" font-weight="700">즉시 실행됨</text>
  <text x="286" y="204" font-size="10.5" fill="#6B7280">call → Comma 연상</text>

  <!-- bind -->
  <rect x="510" y="65" width="220" height="180" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
  <text x="526" y="92" font-size="14" font-weight="700" fill="#92400E">bind</text>
  <text x="526" y="116" font-size="11" font-family="monospace" fill="#B45309">const f = addArgs.bind(</text>
  <text x="536" y="134" font-size="11" font-family="monospace" fill="#B45309">cheshire);</text>
  <text x="526" y="160" font-size="11.5" fill="#92400E">this만 미리 연결해 새 함수를 반환</text>
  <text x="526" y="182" font-size="11.5" fill="#92400E" font-weight="700">즉시 실행 안 됨 - f(5, 6)처럼</text>
  <text x="526" y="200" font-size="11.5" fill="#92400E" font-weight="700">나중에 한 번 더 호출해야 함</text>

  <rect x="30" y="270" width="700" height="105" rx="10" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="50" y="297" font-size="13" font-weight="700" fill="#1F2937">40_page.html 실습 정리</text>
  <text x="50" y="321" font-size="12.5" fill="#374151">introduce.apply(hellobit) / introduce.call(caterpillar) → 그 자리에서 바로 실행</text>
  <text x="50" y="343" font-size="12.5" fill="#374151">const func = introduce.bind(cheshire); func(); → bind는 실행기를 "만들어 두기"만 함</text>
  <text x="50" y="365" font-size="12" fill="#6B7280">셋 다 목적은 같다: 함수를 호출할 때 this를 원하는 객체로 강제 연결하는 것</text>
</svg>
