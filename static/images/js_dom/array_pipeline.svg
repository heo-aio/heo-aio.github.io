<svg viewBox="0 0 760 420" xmlns="http://www.w3.org/2000/svg" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">
  <rect x="0" y="0" width="760" height="420" fill="#F9FAFB"/>
  <text x="30" y="35" font-size="17" font-weight="700" fill="#1F2937">map → filter → map  데이터 파이프라인 (info_list 실습)</text>

  <!-- Stage 1 -->
  <rect x="20" y="70" width="150" height="90" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
  <text x="35" y="95" font-size="13" font-weight="700" fill="#3730A3">info_list</text>
  <text x="35" y="115" font-size="11.5" fill="#4338CA">{id,name,grade,score}</text>
  <text x="35" y="132" font-size="11.5" fill="#4338CA">x 6명</text>

  <path d="M175 115 L 225 115" stroke="#6B7280" stroke-width="2" marker-end="url(#a3)"/>
  <text x="178" y="105" font-size="11.5" fill="#374151">.map(item =&gt;</text>
  <text x="178" y="150" font-size="11.5" fill="#374151">item.name += '학생')</text>

  <!-- Stage 2 -->
  <rect x="230" y="70" width="150" height="90" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  <text x="245" y="95" font-size="13" font-weight="700" fill="#065F46">students</text>
  <text x="245" y="115" font-size="11.5" fill="#047857">name에 '학생' 붙음</text>
  <text x="245" y="132" font-size="11.5" fill="#047857">x 6명 (원본 개수 유지)</text>

  <path d="M385 115 L 435 115" stroke="#6B7280" stroke-width="2" marker-end="url(#a3)"/>
  <text x="388" y="105" font-size="11.5" fill="#374151">.filter(info =&gt;</text>
  <text x="388" y="150" font-size="11.5" fill="#374151">info.score &lt; 70)</text>

  <!-- Stage 3 -->
  <rect x="440" y="70" width="150" height="90" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
  <text x="455" y="95" font-size="13" font-weight="700" fill="#92400E">supple</text>
  <text x="455" y="115" font-size="11.5" fill="#92400E">score &lt; 70인 학생만</text>
  <text x="455" y="132" font-size="11.5" fill="#92400E">x 2명 (개수 줄어듦)</text>

  <path d="M595 115 L 645 115" stroke="#6B7280" stroke-width="2" marker-end="url(#a3)"/>
  <text x="598" y="105" font-size="11.5" fill="#374151">.map(item =&gt;</text>
  <text x="598" y="150" font-size="11.5" fill="#374151">item.name)</text>

  <!-- Stage 4 -->
  <rect x="620" y="70" width="120" height="90" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="2"/>
  <text x="632" y="95" font-size="13" font-weight="700" fill="#991B1B">students_name</text>
  <text x="632" y="115" font-size="11" fill="#991B1B">이름 문자열만</text>
  <text x="632" y="132" font-size="11" fill="#991B1B">x 2개 배열</text>

  <!-- 하단 규칙 -->
  <rect x="20" y="210" width="720" height="180" rx="10" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="40" y="240" font-size="14" font-weight="700" fill="#1F2937">배열 길이 관점으로 구분하면 헷갈리지 않는다</text>

  <circle cx="55" cy="270" r="6" fill="#059669"/>
  <text x="70" y="275" font-size="13" fill="#374151"><tspan font-weight="700" fill="#047857">map</tspan> : 길이 그대로, 각 요소를 가공해서 새 배열로 반환</text>

  <circle cx="55" cy="300" r="6" fill="#D97706"/>
  <text x="70" y="305" font-size="13" fill="#374151"><tspan font-weight="700" fill="#92400E">filter</tspan> : 조건을 만족하는 요소만 남겨 길이가 줄어들 수 있음</text>

  <circle cx="55" cy="330" r="6" fill="#DC2626"/>
  <text x="70" y="335" font-size="13" fill="#374151"><tspan font-weight="700" fill="#991B1B">reduce</tspan> : 배열 전체를 순회하며 값 하나로 누적(합계, 평균 등)</text>

  <text x="40" y="365" font-size="12.5" fill="#6B7280">→ "몇 개가 나와야 하는가"를 먼저 생각하면 map/filter/reduce 중 뭘 써야 할지 감이 잡힌다.</text>

  <defs>
    <marker id="a3" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#6B7280"/>
    </marker>
  </defs>
</svg>
