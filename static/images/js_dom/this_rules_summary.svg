<svg viewBox="0 0 760 460" xmlns="http://www.w3.org/2000/svg" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">
  <rect x="0" y="0" width="760" height="460" fill="#F9FAFB"/>
  <text x="30" y="36" font-size="17" font-weight="700" fill="#1F2937">this는 무엇을 가리키는가 - 상황별 4가지 규칙</text>

  <!-- 규칙1 -->
  <rect x="30" y="60" width="340" height="110" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
  <text x="48" y="86" font-size="13" font-weight="700" fill="#3730A3">① 객체의 메서드로 호출</text>
  <text x="48" y="108" font-size="11.5" font-family="monospace" fill="#4338CA">obj.introduce()</text>
  <text x="48" y="128" font-size="11.5" fill="#4338CA">→ this = obj (자신을 호출한 객체)</text>
  <text x="48" y="150" font-size="11" fill="#6B7280">파이썬의 self와 비슷한 역할</text>

  <!-- 규칙2 -->
  <rect x="390" y="60" width="340" height="110" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="2"/>
  <text x="408" y="86" font-size="13" font-weight="700" fill="#991B1B">② 그냥 함수로 호출</text>
  <text x="408" y="108" font-size="11.5" font-family="monospace" fill="#B91C1C">outerFunc()</text>
  <text x="408" y="128" font-size="11.5" fill="#B91C1C">→ this = window (소속 객체가 없음)</text>
  <text x="408" y="150" font-size="11" fill="#6B7280">중첩 함수도 마찬가지로 window</text>

  <!-- 규칙3 -->
  <rect x="30" y="190" width="340" height="130" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
  <text x="48" y="216" font-size="13" font-weight="700" fill="#92400E">③ apply / call / bind로 강제 지정</text>
  <text x="48" y="238" font-size="11.5" font-family="monospace" fill="#B45309">introduce.call(caterpillar)</text>
  <text x="48" y="258" font-size="11.5" fill="#B45309">→ this = caterpillar (강제 연결)</text>
  <text x="48" y="280" font-size="11" fill="#6B7280">함수가 원래 어디 소속이었는지와</text>
  <text x="48" y="298" font-size="11" fill="#6B7280">무관하게 원하는 객체로 바꿀 수 있음</text>

  <!-- 규칙4 -->
  <rect x="390" y="190" width="340" height="130" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  <text x="408" y="216" font-size="13" font-weight="700" fill="#065F46">④ 화살표 함수</text>
  <text x="408" y="238" font-size="11.5" font-family="monospace" fill="#047857">btn.addEventListener('click',</text>
  <text x="408" y="256" font-size="11.5" font-family="monospace" fill="#047857">  evt =&gt; console.log(this))</text>
  <text x="408" y="278" font-size="11.5" fill="#047857">→ this = 정의된 위치의 상위 this</text>
  <text x="408" y="298" font-size="11" fill="#6B7280">자신만의 this를 만들지 않고 그대로 물려받음</text>

  <!-- 하단 정리 -->
  <rect x="30" y="345" width="700" height="90" rx="10" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="50" y="372" font-size="13" font-weight="700" fill="#1F2937">한 줄 요약</text>
  <text x="50" y="396" font-size="12.5" fill="#374151">this는 "누가 호출했는가"로 정해진다 - 단, apply/call/bind는 강제로 바꾸고,</text>
  <text x="50" y="418" font-size="12.5" fill="#374151">화살표 함수는 애초에 "호출자"라는 개념 자체가 없어서 상위 스코프의 this를 그대로 쓴다</text>
</svg>
