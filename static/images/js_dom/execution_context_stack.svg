<svg viewBox="0 0 780 460" xmlns="http://www.w3.org/2000/svg" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">
  <rect x="0" y="0" width="780" height="460" fill="#F9FAFB"/>
  <text x="30" y="36" font-size="17" font-weight="700" fill="#1F2937">실행 컨텍스트 스택 - 27_page.html 호출 순서</text>

  <!-- 왼쪽: 코드 흐름 -->
  <rect x="30" y="65" width="330" height="360" rx="10" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="50" y="92" font-size="13" font-weight="700" fill="#1F2937">코드 실행 순서</text>
  <text x="50" y="118" font-size="12" font-family="monospace" fill="#374151">console.log(global) // 전역</text>
  <text x="50" y="142" font-size="12" font-family="monospace" fill="#4F46E5">outerFunc() 호출 ↓</text>
  <text x="65" y="166" font-size="12" font-family="monospace" fill="#374151">console.log(global) // 20</text>
  <text x="65" y="190" font-size="12" font-family="monospace" fill="#059669">innerFunc() 호출 ↓</text>
  <text x="80" y="214" font-size="12" font-family="monospace" fill="#374151">console.log(global) // 20</text>
  <text x="80" y="238" font-size="12" font-family="monospace" fill="#374151">console.log(local1) // 40</text>
  <text x="65" y="262" font-size="12" font-family="monospace" fill="#059669">innerFunc 종료 ↑</text>
  <text x="50" y="286" font-size="12" font-family="monospace" fill="#4F46E5">outerFunc 종료 ↑</text>
  <text x="50" y="310" font-size="12" font-family="monospace" fill="#374151">(다시 전역으로)</text>

  <text x="50" y="360" font-size="12" fill="#6B7280">함수를 호출하면 컨텍스트가 스택에</text>
  <text x="50" y="380" font-size="12" fill="#6B7280">"쌓이고", 함수가 끝나면 그 컨텍스트만</text>
  <text x="50" y="400" font-size="12" fill="#6B7280">"뽑혀 나간다" (LIFO 구조)</text>

  <!-- 오른쪽: 스택 시각화 3단계, 바닥선(y=349)에 정렬해서 위로 쌓음 -->
  <text x="420" y="92" font-size="13" font-weight="700" fill="#1F2937">호출 스택 (바닥부터 위로 쌓임)</text>

  <!-- t1: 전역만 -->
  <text x="460" y="365" font-size="11.5" fill="#6B7280" text-anchor="middle">t1</text>
  <rect x="405" y="315" width="110" height="34" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
  <text x="460" y="336" font-size="10.5" fill="#3730A3" text-anchor="middle">전역</text>

  <!-- t2: 전역 + outerFunc -->
  <text x="580" y="365" font-size="11.5" fill="#6B7280" text-anchor="middle">t2</text>
  <rect x="525" y="315" width="110" height="34" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
  <text x="580" y="336" font-size="10.5" fill="#3730A3" text-anchor="middle">전역</text>
  <rect x="525" y="275" width="110" height="34" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  <text x="580" y="296" font-size="10.5" fill="#065F46" text-anchor="middle">outerFunc</text>

  <!-- t3: 전역 + outerFunc + innerFunc -->
  <text x="700" y="365" font-size="11.5" fill="#6B7280" text-anchor="middle">t3</text>
  <rect x="645" y="315" width="110" height="34" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
  <text x="700" y="336" font-size="10.5" fill="#3730A3" text-anchor="middle">전역</text>
  <rect x="645" y="275" width="110" height="34" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  <text x="700" y="296" font-size="10.5" fill="#065F46" text-anchor="middle">outerFunc</text>
  <rect x="645" y="235" width="110" height="34" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
  <text x="700" y="256" font-size="10.5" fill="#92400E" text-anchor="middle">innerFunc</text>

  <!-- 바닥선 -->
  <line x1="400" y1="349" x2="760" y2="349" stroke="#9CA3AF" stroke-width="1.5"/>

  <rect x="405" y="395" width="330" height="55" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="420" y="416" font-size="12" fill="#DC2626" font-weight="700">종료 순서는 항상 "가장 최근에 쌓인 것"부터</text>
  <text x="420" y="436" font-size="11.5" fill="#374151">t3 → innerFunc 제거 → t2 → outerFunc 제거 → t1</text>
</svg>
