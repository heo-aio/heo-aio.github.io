<svg viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg" font-family="'Pretendard','Malgun Gothic',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="900" height="300" fill="#fafafa"/>
  <text x="450" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#222">JWT 구조 - 점(.)으로 구분된 3부분</text>

  <!-- token string -->
  <rect x="40" y="60" width="820" height="46" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="60" y="88" font-size="10.5" font-family="monospace" fill="#334155">eyJhbGciOiJIUzI1NiJ9<tspan fill="#dc2626">.</tspan>eyJpZCI6ImFkbWluIiwicHciOiJwYXNzIn0<tspan fill="#dc2626">.</tspan>jjdC6UU2TgQYgZ...</text>

  <!-- 3 boxes -->
  <rect x="60" y="130" width="230" height="90" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.8"/>
  <text x="175" y="156" text-anchor="middle" font-size="13" font-weight="700" fill="#3730a3">Header</text>
  <text x="175" y="176" text-anchor="middle" font-size="11" fill="#3730a3">알고리즘(HS256),</text>
  <text x="175" y="192" text-anchor="middle" font-size="11" fill="#3730a3">토큰 타입 정보</text>

  <rect x="335" y="130" width="230" height="90" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.8"/>
  <text x="450" y="156" text-anchor="middle" font-size="13" font-weight="700" fill="#713f12">Payload</text>
  <text x="450" y="176" text-anchor="middle" font-size="11" fill="#713f12">{id, pw, iat, exp}</text>
  <text x="450" y="192" text-anchor="middle" font-size="11" fill="#713f12">← jwt.sign()에 넣은 값</text>

  <rect x="610" y="130" width="230" height="90" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="725" y="156" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">Signature</text>
  <text x="725" y="176" text-anchor="middle" font-size="11" fill="#991b1b">Header+Payload를</text>
  <text x="725" y="192" text-anchor="middle" font-size="11" fill="#991b1b">KEY로 서명한 값</text>

  <!-- note -->
  <rect x="60" y="240" width="780" height="46" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.3"/>
  <text x="450" y="266" text-anchor="middle" font-size="12" fill="#9a3412">Header/Payload는 그냥 Base64 인코딩 - 누구나 디코딩해서 읽을 수 있음 (암호화 아님)</text>

  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#999"/></marker>
  </defs>
</svg>
