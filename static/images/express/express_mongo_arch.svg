<svg viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg" font-family="'Pretendard','Malgun Gothic',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="900" height="300" fill="#fafafa"/>
  <text x="450" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#222">Client → Express → Router → Mongoose Model → MongoDB</text>

  <rect x="20" y="90" width="140" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.6"/>
  <text x="90" y="120" text-anchor="middle" font-size="12.5" font-weight="700" fill="#3730a3">Client</text>
  <text x="90" y="140" text-anchor="middle" font-size="10.5" fill="#3730a3">POST /member/join</text>

  <line x1="160" y1="125" x2="196" y2="125" stroke="#999" stroke-width="2" marker-end="url(#a)"/>

  <rect x="200" y="90" width="150" height="70" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.8"/>
  <text x="275" y="115" text-anchor="middle" font-size="12" font-weight="700" fill="#075985">app.js</text>
  <text x="275" y="133" text-anchor="middle" font-size="10.5" fill="#075985">cors, express.json()</text>
  <text x="275" y="149" text-anchor="middle" font-size="10.5" fill="#075985">/member 마운트</text>

  <line x1="350" y1="125" x2="386" y2="125" stroke="#999" stroke-width="2" marker-end="url(#a)"/>

  <rect x="390" y="90" width="150" height="70" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.8"/>
  <text x="465" y="115" text-anchor="middle" font-size="12" font-weight="700" fill="#713f12">member_router.js</text>
  <text x="465" y="133" text-anchor="middle" font-size="10.5" fill="#713f12">join/list/get</text>
  <text x="465" y="149" text-anchor="middle" font-size="10.5" fill="#713f12">update/delete</text>

  <line x1="540" y1="125" x2="576" y2="125" stroke="#999" stroke-width="2" marker-end="url(#a)"/>

  <rect x="580" y="90" width="150" height="70" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="655" y="115" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b">model.js</text>
  <text x="655" y="133" text-anchor="middle" font-size="10.5" fill="#991b1b">mongoose.Schema</text>
  <text x="655" y="149" text-anchor="middle" font-size="10.5" fill="#991b1b">검증 규칙 정의</text>

  <line x1="730" y1="125" x2="766" y2="125" stroke="#999" stroke-width="2" marker-end="url(#a)"/>

  <rect x="770" y="90" width="110" height="70" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
  <text x="825" y="118" text-anchor="middle" font-size="12" font-weight="700" fill="#14532d">MongoDB</text>
  <text x="825" y="138" text-anchor="middle" font-size="10.5" fill="#14532d">member</text>
  <text x="825" y="152" text-anchor="middle" font-size="10.5" fill="#14532d">컬렉션</text>

  <!-- db.js note -->
  <line x1="655" y1="160" x2="655" y2="200" stroke="#999" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="500" y="204" width="310" height="60" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/>
  <text x="655" y="228" text-anchor="middle" font-size="11.5" fill="#334155">db.js의 connectDB()가 app.js 시작 시</text>
  <text x="655" y="246" text-anchor="middle" font-size="11.5" fill="#334155">mongoose.connect()로 미리 연결해둔 상태</text>

  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#999"/></marker>
  </defs>
</svg>
