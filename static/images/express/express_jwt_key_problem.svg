<svg viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" font-family="'Pretendard','Malgun Gothic',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="900" height="420" fill="#fafafa"/>
  <text x="450" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#222">/login → /check 흐름과 KEY 문제</text>

  <!-- login flow -->
  <rect x="40" y="60" width="230" height="80" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.8"/>
  <text x="155" y="86" text-anchor="middle" font-size="12.5" font-weight="700" fill="#3730a3">POST /login</text>
  <text x="155" y="106" text-anchor="middle" font-size="10.5" fill="#3730a3">jwt.sign({id, pw}, KEY,</text>
  <text x="155" y="122" text-anchor="middle" font-size="10.5" fill="#3730a3">{expiresIn:'30m'})</text>

  <line x1="270" y1="100" x2="310" y2="100" stroke="#999" stroke-width="2" marker-end="url(#a)"/>

  <rect x="314" y="60" width="230" height="80" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.8"/>
  <text x="429" y="86" text-anchor="middle" font-size="12.5" font-weight="700" fill="#713f12">클라이언트</text>
  <text x="429" y="106" text-anchor="middle" font-size="10.5" fill="#713f12">받은 토큰을</text>
  <text x="429" y="122" text-anchor="middle" font-size="10.5" fill="#713f12">Authorization 헤더에 담아 보관</text>

  <line x1="544" y1="100" x2="584" y2="100" stroke="#999" stroke-width="2" marker-end="url(#a)"/>

  <rect x="588" y="60" width="230" height="80" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.8"/>
  <text x="703" y="86" text-anchor="middle" font-size="12.5" font-weight="700" fill="#075985">POST /check</text>
  <text x="703" y="106" text-anchor="middle" font-size="10.5" fill="#075985">jwt.verify(token, KEY)</text>
  <text x="703" y="122" text-anchor="middle" font-size="10.5" fill="#075985">서명 시 KEY와 같아야 통과</text>

  <!-- server restart problem -->
  <line x1="703" y1="140" x2="703" y2="176" stroke="#dc2626" stroke-width="2.2" marker-end="url(#r)"/>

  <rect x="480" y="180" width="440" height="100" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="700" y="204" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">서버가 재시작되면?</text>
  <text x="700" y="226" text-anchor="middle" font-size="11.5" fill="#991b1b">KEY = crypto.randomBytes(64) 코드가</text>
  <text x="700" y="244" text-anchor="middle" font-size="11.5" fill="#991b1b">재실행되며 새 KEY 생성</text>
  <text x="700" y="262" text-anchor="middle" font-size="11.5" fill="#991b1b">→ 로그인 때 서명한 KEY ≠ 검증할 KEY</text>

  <line x1="700" y1="280" x2="700" y2="306" stroke="#dc2626" stroke-width="2" marker-end="url(#r)"/>
  <rect x="560" y="310" width="280" height="46" rx="8" fill="#fff1f2" stroke="#dc2626" stroke-width="1.4"/>
  <text x="700" y="338" text-anchor="middle" font-size="12" fill="#991b1b">기존 토큰이 전부 무효 처리됨</text>

  <!-- solution -->
  <rect x="40" y="184" width="400" height="96" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
  <text x="240" y="208" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">해결 방향</text>
  <text x="240" y="230" text-anchor="middle" font-size="11.5" fill="#14532d">KEY를 코드 실행마다 새로 만들지 않고</text>
  <text x="240" y="248" text-anchor="middle" font-size="11.5" fill="#14532d">.env 등에 고정값으로 저장해두고</text>
  <text x="240" y="266" text-anchor="middle" font-size="11.5" fill="#14532d">서버 재시작에도 같은 값을 읽어오기</text>

  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#999"/></marker>
    <marker id="r" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#dc2626"/></marker>
  </defs>
</svg>
