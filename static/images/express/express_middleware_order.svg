<svg viewBox="0 0 900 460" xmlns="http://www.w3.org/2000/svg" font-family="'Pretendard','Malgun Gothic',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="900" height="460" fill="#fafafa"/>
  <text x="450" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#222">미들웨어 실행 순서 - app.use()는 등록한 순서대로</text>

  <!-- request in -->
  <rect x="370" y="60" width="160" height="40" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="450" y="85" text-anchor="middle" font-size="13" fill="#3730a3">요청 (GET /)</text>
  <line x1="450" y1="100" x2="450" y2="128" stroke="#999" stroke-width="2" marker-end="url(#b)"/>

  <!-- pre handler -->
  <rect x="230" y="132" width="440" height="80" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="450" y="158" text-anchor="middle" font-size="14" font-weight="700" fill="#075985">① app.use() - Pre Handler</text>
  <text x="450" y="178" text-anchor="middle" font-size="11.5" fill="#075985">req.query.grade 확인</text>
  <text x="450" y="196" text-anchor="middle" font-size="11.5" fill="#075985">S가 아니면 res.status(403)로 즉시 종료</text>

  <line x1="450" y1="212" x2="450" y2="240" stroke="#16a34a" stroke-width="2.2" marker-end="url(#g)"/>
  <text x="470" y="230" font-size="11.5" fill="#15803d" font-weight="700">next() 호출 시 통과</text>

  <!-- router -->
  <rect x="230" y="244" width="440" height="80" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="450" y="270" text-anchor="middle" font-size="14" font-weight="700" fill="#713f12">② app.get('/') - 라우터</text>
  <text x="450" y="290" text-anchor="middle" font-size="11.5" fill="#713f12">res.send('라우터 접근과 반환')</text>
  <text x="450" y="308" text-anchor="middle" font-size="11.5" fill="#713f12">→ 응답을 이미 보냈는데 next()도 호출함</text>

  <line x1="450" y1="324" x2="450" y2="352" stroke="#999" stroke-width="2" marker-end="url(#b)"/>

  <!-- post handler -->
  <rect x="230" y="356" width="440" height="70" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="450" y="382" text-anchor="middle" font-size="14" font-weight="700" fill="#991b1b">③ app.use() - Post Handler</text>
  <text x="450" y="402" text-anchor="middle" font-size="11.5" fill="#991b1b">console.log만 실행 (응답은 이미 끝난 상태)</text>

  <!-- side note -->
  <rect x="700" y="140" width="180" height="150" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/>
  <text x="790" y="164" text-anchor="middle" font-size="11.5" font-weight="700" fill="#334155">주의할 점</text>
  <text x="712" y="188" font-size="10.5" fill="#334155">res.send 이후에</text>
  <text x="712" y="204" font-size="10.5" fill="#334155">next()를 불러도</text>
  <text x="712" y="220" font-size="10.5" fill="#334155">에러는 안 나지만</text>
  <text x="712" y="242" font-size="10.5" fill="#334155">다음 핸들러에서</text>
  <text x="712" y="258" font-size="10.5" fill="#334155">또 res.send를</text>
  <text x="712" y="274" font-size="10.5" fill="#334155">시도하면 에러남</text>

  <defs>
    <marker id="b" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#999"/></marker>
    <marker id="g" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#16a34a"/></marker>
  </defs>
</svg>
