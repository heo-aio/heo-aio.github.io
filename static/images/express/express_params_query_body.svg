<svg viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg" font-family="'Pretendard','Malgun Gothic',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="900" height="480" fill="#fafafa"/>
  <text x="450" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#222">req.params vs req.query vs req.body</text>

  <!-- params -->
  <rect x="40" y="70" width="250" height="120" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.8"/>
  <text x="165" y="98" text-anchor="middle" font-size="14.5" font-weight="700" fill="#3730a3">req.params</text>
  <text x="165" y="122" text-anchor="middle" font-size="12" fill="#3730a3">URL 경로 자체에 값이 있음</text>
  <rect x="56" y="132" width="218" height="44" rx="6" fill="#ffffff" stroke="#6366f1" stroke-width="1.2"/>
  <text x="165" y="150" text-anchor="middle" font-size="11" fill="#3730a3" font-family="monospace">/rest/:id/:pw</text>
  <text x="165" y="167" text-anchor="middle" font-size="10.5" fill="#4338ca" font-family="monospace">GET /rest/admin/pass</text>

  <!-- query -->
  <rect x="325" y="70" width="250" height="120" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.8"/>
  <text x="450" y="98" text-anchor="middle" font-size="14.5" font-weight="700" fill="#713f12">req.query</text>
  <text x="450" y="122" text-anchor="middle" font-size="12" fill="#713f12">? 뒤에 붙는 값</text>
  <rect x="341" y="132" width="218" height="44" rx="6" fill="#ffffff" stroke="#ca8a04" stroke-width="1.2"/>
  <text x="450" y="150" text-anchor="middle" font-size="10.5" fill="#713f12" font-family="monospace">/get_method?id=..</text>
  <text x="450" y="167" text-anchor="middle" font-size="10.5" fill="#854d0e" font-family="monospace">&amp;pw=..&amp;mm=..</text>

  <!-- body -->
  <rect x="610" y="70" width="250" height="120" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="735" y="98" text-anchor="middle" font-size="14.5" font-weight="700" fill="#991b1b">req.body</text>
  <text x="735" y="122" text-anchor="middle" font-size="12" fill="#991b1b">요청 본문(JSON 등)에 담김</text>
  <rect x="626" y="132" width="218" height="44" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.2"/>
  <text x="735" y="150" text-anchor="middle" font-size="10.5" fill="#991b1b" font-family="monospace">POST /login</text>
  <text x="735" y="167" text-anchor="middle" font-size="10.5" fill="#7f1d1d" font-family="monospace">{"{id, pw}"}</text>

  <!-- caution note for body -->
  <line x1="735" y1="190" x2="735" y2="220" stroke="#dc2626" stroke-width="2" marker-end="url(#ax)"/>
  <rect x="600" y="224" width="270" height="56" rx="8" fill="#fff1f2" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="4,3"/>
  <text x="735" y="248" text-anchor="middle" font-size="11.5" fill="#991b1b" font-weight="700">express.json() 미들웨어 필수!</text>
  <text x="735" y="266" text-anchor="middle" font-size="10.5" fill="#991b1b">안 붙이면 req.body가 undefined</text>

  <!-- bottom summary table -->
  <rect x="60" y="320" width="780" height="130" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="450" y="348" text-anchor="middle" font-size="13.5" font-weight="700" fill="#334155">한눈에 비교</text>

  <text x="90" y="376" font-size="12" fill="#3730a3" font-weight="700">params</text>
  <text x="230" y="376" font-size="12" fill="#334155">→ 값이 URL 경로 안에 있음 (/:id/:pw)</text>

  <text x="90" y="400" font-size="12" fill="#854d0e" font-weight="700">query</text>
  <text x="230" y="400" font-size="12" fill="#334155">→ URL 뒤에 ?key=value&amp;... 형태로 붙음</text>

  <text x="90" y="424" font-size="12" fill="#991b1b" font-weight="700">body</text>
  <text x="230" y="424" font-size="12" fill="#334155">→ 요청 본문에 JSON으로 담김 (GET에선 보통 안 씀)</text>

  <defs>
    <marker id="ax" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#dc2626"/></marker>
  </defs>
</svg>
