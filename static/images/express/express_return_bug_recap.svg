<svg viewBox="0 0 900 340" xmlns="http://www.w3.org/2000/svg" font-family="'Pretendard','Malgun Gothic',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="900" height="340" fill="#fafafa"/>
  <text x="450" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#222">저번에 배운 버그가 여기서도 똑같이 숨어있었다</text>

  <rect x="60" y="64" width="780" height="90" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="450" y="90" text-anchor="middle" font-size="12.5" font-family="monospace" fill="#7f1d1d">if (member == null) { res.json({success:false, msg:'없는 회원'}) }</text>
  <text x="450" y="112" text-anchor="middle" font-size="12.5" font-family="monospace" fill="#7f1d1d">res.json({success:true, msg:'수정 완료', data:member})  ← return 없음</text>
  <text x="450" y="136" text-anchor="middle" font-size="11.5" fill="#991b1b">member가 null이면 두 res.json()이 둘 다 실행되려고 시도함</text>

  <line x1="450" y1="154" x2="450" y2="182" stroke="#999" stroke-width="2" marker-end="url(#a)"/>

  <rect x="220" y="186" width="460" height="60" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="450" y="212" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">Error: Cannot set headers after they are sent</text>
  <text x="450" y="232" text-anchor="middle" font-size="11.5" fill="#991b1b">회원이 존재하지 않는 요청(get/update/delete)에서 발생</text>

  <line x1="450" y1="246" x2="450" y2="274" stroke="#16a34a" stroke-width="2.2" marker-end="url(#g)"/>

  <rect x="200" y="278" width="500" height="50" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
  <text x="450" y="308" text-anchor="middle" font-size="12" font-family="monospace" fill="#14532d">if (member == null) { return res.json({...}) }</text>

  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#999"/></marker>
    <marker id="g" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#16a34a"/></marker>
  </defs>
</svg>
