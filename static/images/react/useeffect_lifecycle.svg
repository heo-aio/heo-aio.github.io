<svg viewBox="0 0 700 260" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#6b6375" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="700" height="260" fill="#ffffff"/>
  <text x="350" y="26" text-anchor="middle" font-size="14" fill="#08060d" font-weight="600">컴포넌트 생명주기와 cleanup 함수 실행 시점</text>

  <!-- mount -->
  <rect x="30" y="60" width="180" height="70" rx="8" fill="#f4f3ec" stroke="#aa3bff" stroke-width="1.5"/>
  <text x="120" y="88" text-anchor="middle" font-size="12" fill="#aa3bff" font-weight="700">최초 렌더링(mount)</text>
  <text x="120" y="106" text-anchor="middle" font-size="9.5" fill="#6b6375">useEffect(fn, []) 실행</text>
  <text x="120" y="120" text-anchor="middle" font-size="9.5" fill="#6b6375">"최초 렌더링 시 실행"</text>

  <line x1="210" y1="95" x2="246" y2="95" stroke="#6b6375" stroke-width="1.5" marker-end="url(#arrow4)"/>

  <!-- update -->
  <rect x="250" y="60" width="180" height="70" rx="8" fill="#f4f3ec" stroke="#e5e4e7" stroke-width="1.5"/>
  <text x="340" y="88" text-anchor="middle" font-size="12" fill="#08060d" font-weight="700">업데이트</text>
  <text x="340" y="106" text-anchor="middle" font-size="9.5" fill="#6b6375">num 바뀔 때마다</text>
  <text x="340" y="120" text-anchor="middle" font-size="9.5" fill="#6b6375">useEffect(fn,[num]) 실행</text>

  <line x1="430" y1="95" x2="466" y2="95" stroke="#6b6375" stroke-width="1.5" marker-end="url(#arrow4)"/>

  <!-- unmount -->
  <rect x="470" y="60" width="200" height="70" rx="8" fill="#f4f3ec" stroke="#aa3bff" stroke-width="1.5"/>
  <text x="570" y="82" text-anchor="middle" font-size="12" fill="#aa3bff" font-weight="700">언마운트(unmount)</text>
  <text x="570" y="100" text-anchor="middle" font-size="9.5" fill="#6b6375">setComp(null) → 컴포넌트 삭제</text>
  <text x="570" y="115" text-anchor="middle" font-size="9.5" fill="#aa3bff" font-weight="600">cleanup 함수 실행</text>

  <!-- cleanup callout -->
  <rect x="380" y="165" width="260" height="70" rx="8" fill="#ffffff" stroke="#aa3bff" stroke-width="1.5"/>
  <text x="510" y="188" text-anchor="middle" font-size="10.5" font-family="ui-monospace, monospace" fill="#08060d">return function(){ ... }</text>
  <text x="510" y="206" text-anchor="middle" font-size="10" fill="#6b6375">"컴포넌트 삭제될 때 실행"</text>
  <text x="510" y="222" text-anchor="middle" font-size="10" fill="#6b6375">뒷정리(타이머 해제, 구독 해제 등)</text>
  <line x1="570" y1="130" x2="570" y2="163" stroke="#aa3bff" stroke-width="1.5" marker-end="url(#arrow4)"/>
</svg>
