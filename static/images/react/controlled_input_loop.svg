<svg viewBox="0 0 700 280" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#6b6375" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="700" height="280" fill="#ffffff"/>
  <text x="350" y="28" text-anchor="middle" font-size="14" fill="#08060d" font-weight="600">제어 컴포넌트(Controlled Input) - value와 onChange는 한 쌍</text>

  <!-- state box top -->
  <rect x="270" y="50" width="160" height="50" rx="8" fill="#f4f3ec" stroke="#aa3bff" stroke-width="1.5"/>
  <text x="350" y="72" text-anchor="middle" font-size="11.5" fill="#aa3bff" font-weight="700">state (text)</text>
  <text x="350" y="88" text-anchor="middle" font-size="9.5" fill="#6b6375">React가 기억하는 값</text>

  <!-- input box bottom -->
  <rect x="270" y="200" width="160" height="50" rx="8" fill="#f4f3ec" stroke="#e5e4e7" stroke-width="1.5"/>
  <text x="350" y="222" text-anchor="middle" font-size="11.5" fill="#08060d" font-weight="700">&lt;input&gt;</text>
  <text x="350" y="238" text-anchor="middle" font-size="9.5" fill="#6b6375">화면에 보이는 값</text>

  <!-- right path: state -> input via value -->
  <path d="M430 75 C 560 75, 560 225, 432 225" fill="none" stroke="#6b6375" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <text x="565" y="150" text-anchor="middle" font-size="10.5" fill="#08060d" font-weight="600">value={"{text}"}</text>
  <text x="565" y="166" text-anchor="middle" font-size="9.5" fill="#6b6375">state를 화면에 표시</text>

  <!-- left path: input -> state via onChange -->
  <path d="M270 225 C 140 225, 140 75, 268 75" fill="none" stroke="#aa3bff" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <text x="135" y="150" text-anchor="middle" font-size="10.5" fill="#aa3bff" font-weight="600">onChange</text>
  <text x="135" y="166" text-anchor="middle" font-size="9.5" fill="#6b6375">setText(e.target.value)</text>

  <text x="350" y="270" text-anchor="middle" font-size="10.5" fill="#6b6375" font-style="italic">value만 있고 onChange가 없으면 입력이 막힌다 - 두 개가 한 세트</text>
</svg>
