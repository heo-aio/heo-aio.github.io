<svg width="100%" viewBox="0 0 680 580" xmlns="http://www.w3.org/2000/svg" role="img">
<title>addByAmount(5) 디스패치 시 payload가 흐르는 과정</title>
<desc>컴포넌트에서 dispatch(addByAmount(5))를 호출하면 type과 payload를 가진 action 객체가 만들어지고, reducer가 action.payload를 읽어 state.value에 더한 뒤 store에 저장하고, useSelector로 구독한 컴포넌트가 리렌더링되는 과정을 보여주는 다이어그램</desc>
<style>
:root {
  --blue-bg:#E6F1FB; --blue-stroke:#185FA5; --blue-text:#0C447C;
  --amber-bg:#FAEEDA; --amber-stroke:#854F0B; --amber-text:#633806;
  --purple-bg:#EEEDFE; --purple-stroke:#534AB7; --purple-text:#3C3489;
  --teal-bg:#E1F5EE; --teal-stroke:#0F6E56; --teal-text:#085041;
  --sub:#5F5E5A; --arrow:#888780;
}
@media (prefers-color-scheme: dark) {
  :root {
    --blue-bg:#0C447C; --blue-stroke:#85B7EB; --blue-text:#E6F1FB;
    --amber-bg:#633806; --amber-stroke:#FAC775; --amber-text:#FAEEDA;
    --purple-bg:#3C3489; --purple-stroke:#AFA9EC; --purple-text:#EEEDFE;
    --teal-bg:#085041; --teal-stroke:#5DCAA5; --teal-text:#E1F5EE;
    --sub:#B4B2A9; --arrow:#888780;
  }
}
text { font-family: -apple-system, "Segoe UI", "Malgun Gothic", sans-serif; }
.title { font-size: 14px; font-weight: 600; }
.sub { font-size: 12px; }
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="var(--arrow)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<!-- 1. Component -->
<rect x="225" y="40" width="230" height="56" rx="8" style="fill:var(--blue-bg);stroke:var(--blue-stroke)" stroke-width="0.5"/>
<text x="340" y="58" text-anchor="middle" dominant-baseline="central" class="title" style="fill:var(--blue-text)">컴포넌트 (React)</text>
<text x="340" y="76" text-anchor="middle" dominant-baseline="central" class="sub" style="fill:var(--sub)">dispatch(addByAmount(5)) 호출</text>

<line x1="340" y1="96" x2="340" y2="146" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- 2. action 객체 (type + payload) -->
<rect x="225" y="146" width="230" height="72" rx="8" style="fill:var(--amber-bg);stroke:var(--amber-stroke)" stroke-width="0.5"/>
<text x="340" y="164" text-anchor="middle" dominant-baseline="central" class="title" style="fill:var(--amber-text)">action 객체</text>
<text x="340" y="182" text-anchor="middle" dominant-baseline="central" class="sub" style="fill:var(--sub)">type: 'counter/addByAmount'</text>
<text x="340" y="200" text-anchor="middle" dominant-baseline="central" class="sub" style="fill:var(--sub)">payload: 5</text>

<line x1="340" y1="218" x2="340" y2="268" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- 3. reducer -->
<rect x="225" y="268" width="230" height="56" rx="8" style="fill:var(--purple-bg);stroke:var(--purple-stroke)" stroke-width="0.5"/>
<text x="340" y="286" text-anchor="middle" dominant-baseline="central" class="title" style="fill:var(--purple-text)">reducer</text>
<text x="340" y="304" text-anchor="middle" dominant-baseline="central" class="sub" style="fill:var(--sub)">action.payload(5)만큼 value 증가</text>

<line x1="340" y1="324" x2="340" y2="374" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- 4. store -->
<rect x="225" y="374" width="230" height="56" rx="8" style="fill:var(--teal-bg);stroke:var(--teal-stroke)" stroke-width="0.5"/>
<text x="340" y="392" text-anchor="middle" dominant-baseline="central" class="title" style="fill:var(--teal-text)">store</text>
<text x="340" y="410" text-anchor="middle" dominant-baseline="central" class="sub" style="fill:var(--sub)">새 state로 교체 저장</text>

<line x1="340" y1="430" x2="340" y2="480" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- 5. useSelector -->
<rect x="225" y="480" width="230" height="56" rx="8" style="fill:var(--blue-bg);stroke:var(--blue-stroke)" stroke-width="0.5"/>
<text x="340" y="498" text-anchor="middle" dominant-baseline="central" class="title" style="fill:var(--blue-text)">useSelector</text>
<text x="340" y="516" text-anchor="middle" dominant-baseline="central" class="sub" style="fill:var(--sub)">count 값 갱신 → 리렌더링</text>

<!-- return loop -->
<path d="M455,508 C560,508 560,68 455,68" fill="none" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="568" y="288" text-anchor="start" class="sub" style="fill:var(--sub)">화면 다시 렌더링</text>
</svg>
