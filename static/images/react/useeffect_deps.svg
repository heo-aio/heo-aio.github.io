<svg viewBox="0 0 700 330" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <rect width="700" height="330" fill="#ffffff"/>
  <text x="350" y="26" text-anchor="middle" font-size="14" fill="#08060d" font-weight="600">useEffect의 두 번째 인자(의존성 배열)에 따른 실행 시점</text>

  <!-- Row 1: no array -->
  <rect x="30" y="48" width="180" height="60" rx="8" fill="#f4f3ec" stroke="#e5e4e7" stroke-width="1.5"/>
  <text x="120" y="72" text-anchor="middle" font-size="11" font-family="ui-monospace, monospace" fill="#08060d">useEffect(fn)</text>
  <text x="120" y="90" text-anchor="middle" font-size="9.5" fill="#6b6375">배열 없음</text>
  <rect x="240" y="48" width="430" height="60" rx="8" fill="#ffffff" stroke="#e5e4e7"/>
  <text x="255" y="83" font-size="11" fill="#08060d">렌더링될 때마다 매번 실행</text>

  <!-- Row 2: empty array -->
  <rect x="30" y="128" width="180" height="60" rx="8" fill="#f4f3ec" stroke="#aa3bff" stroke-width="1.5"/>
  <text x="120" y="152" text-anchor="middle" font-size="11" font-family="ui-monospace, monospace" fill="#08060d">useEffect(fn, [])</text>
  <text x="120" y="170" text-anchor="middle" font-size="9.5" fill="#6b6375">빈 배열</text>
  <rect x="240" y="128" width="430" height="60" rx="8" fill="#ffffff" stroke="#aa3bff" stroke-width="1.5"/>
  <text x="255" y="155" font-size="11" fill="#08060d" font-weight="600">컴포넌트가 최초 렌더링될 때 딱 1번만 실행</text>
  <text x="255" y="173" font-size="10" fill="#6b6375">생성자처럼 동작</text>

  <!-- Row 3: [num] -->
  <rect x="30" y="208" width="180" height="60" rx="8" fill="#f4f3ec" stroke="#e5e4e7" stroke-width="1.5"/>
  <text x="120" y="232" text-anchor="middle" font-size="11" font-family="ui-monospace, monospace" fill="#08060d">useEffect(fn, [num])</text>
  <text x="120" y="250" text-anchor="middle" font-size="9.5" fill="#6b6375">특정 state 지정</text>
  <rect x="240" y="208" width="430" height="60" rx="8" fill="#ffffff" stroke="#e5e4e7"/>
  <text x="255" y="235" font-size="11" fill="#08060d">num이 바뀔 때만 실행</text>
  <text x="255" y="253" font-size="10" fill="#6b6375">num 외 다른 state 변화는 무시</text>

  <text x="350" y="305" text-anchor="middle" font-size="10.5" fill="#6b6375" font-style="italic">배열이 좁을수록(더 구체적일수록) 실행 조건도 좁아진다</text>
</svg>
