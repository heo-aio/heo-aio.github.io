<svg viewBox="0 0 700 260" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, Consolas, monospace">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#6b6375" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="700" height="260" fill="#ffffff"/>

  <!-- Step 1: JSX source -->
  <rect x="20" y="70" width="140" height="70" rx="8" fill="#f4f3ec" stroke="#aa3bff" stroke-width="1.5"/>
  <text x="90" y="98" text-anchor="middle" font-size="13" fill="#08060d" font-weight="600">JSX 코드</text>
  <text x="90" y="118" text-anchor="middle" font-size="11" fill="#6b6375">&lt;h3&gt;Hello&lt;/h3&gt;</text>

  <line x1="160" y1="105" x2="196" y2="105" stroke="#6b6375" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 2: Babel -->
  <rect x="200" y="70" width="140" height="70" rx="8" fill="#f4f3ec" stroke="#e5e4e7" stroke-width="1.5"/>
  <text x="270" y="98" text-anchor="middle" font-size="13" fill="#08060d" font-weight="600">Babel</text>
  <text x="270" y="118" text-anchor="middle" font-size="11" fill="#6b6375">JS로 변환(transpile)</text>

  <line x1="340" y1="105" x2="376" y2="105" stroke="#6b6375" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 3: React.createElement -->
  <rect x="380" y="60" width="180" height="90" rx="8" fill="#f4f3ec" stroke="#e5e4e7" stroke-width="1.5"/>
  <text x="470" y="86" text-anchor="middle" font-size="12" fill="#08060d" font-weight="600">React.createElement</text>
  <text x="470" y="105" text-anchor="middle" font-size="10.5" fill="#6b6375">('h3', null,</text>
  <text x="470" y="121" text-anchor="middle" font-size="10.5" fill="#6b6375">'Hello')</text>
  <text x="470" y="140" text-anchor="middle" font-size="10.5" fill="#aa3bff">→ 그냥 함수 호출!</text>

  <line x1="560" y1="105" x2="596" y2="105" stroke="#6b6375" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 4: Virtual DOM object -->
  <rect x="600" y="60" width="80" height="90" rx="8" fill="#f4f3ec" stroke="#e5e4e7" stroke-width="1.5"/>
  <text x="640" y="90" text-anchor="middle" font-size="11" fill="#08060d" font-weight="600">JS 객체</text>
  <text x="640" y="108" text-anchor="middle" font-size="10" fill="#6b6375">(Virtual</text>
  <text x="640" y="122" text-anchor="middle" font-size="10" fill="#6b6375">DOM)</text>

  <!-- Down arrow to real DOM -->
  <line x1="640" y1="150" x2="640" y2="185" stroke="#6b6375" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="540" y="188" width="200" height="50" rx="8" fill="#ffffff" stroke="#aa3bff" stroke-width="1.5"/>
  <text x="640" y="210" text-anchor="middle" font-size="12" fill="#aa3bff" font-weight="600">실제 화면 DOM</text>
  <text x="640" y="227" text-anchor="middle" font-size="10" fill="#6b6375">브라우저에 렌더링</text>

  <text x="350" y="20" text-anchor="middle" font-size="13" fill="#08060d" font-weight="600">태그가 "값"으로 취급되는 이유</text>
  <text x="350" y="245" text-anchor="middle" font-size="11" fill="#6b6375" font-style="italic">결국 JSX는 함수 호출이라서, 변수에 담고 조건문 결과로 반환할 수 있다</text>
</svg>
