<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#6b6375" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="700" height="300" fill="#ffffff"/>
  <text x="350" y="26" text-anchor="middle" font-size="13.5" fill="#08060d" font-weight="600">버튼 3번 클릭 → 3초 뒤 setTimeout 콜백 실행 시점</text>

  <!-- click moment -->
  <rect x="30" y="50" width="150" height="40" rx="8" fill="#f4f3ec" stroke="#e5e4e7"/>
  <text x="105" y="75" text-anchor="middle" font-size="11" fill="#08060d">클릭 3번째</text>
  <text x="105" y="100" text-anchor="middle" font-size="9.5" fill="#6b6375">count=3, ref.current=3</text>

  <line x1="180" y1="70" x2="520" y2="70" stroke="#6b6375" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="350" y="62" text-anchor="middle" font-size="10" fill="#6b6375">3초 대기 (그 사이 클릭 계속 가능)</text>

  <!-- state closure box -->
  <rect x="60" y="120" width="260" height="150" rx="10" fill="#f4f3ec" stroke="#e5e4e7" stroke-width="1.5"/>
  <text x="190" y="146" text-anchor="middle" font-size="12" fill="#08060d" font-weight="700">state (count)</text>
  <text x="190" y="176" text-anchor="middle" font-size="10.5" fill="#6b6375">클로저가 "그 시점의</text>
  <text x="190" y="192" text-anchor="middle" font-size="10.5" fill="#6b6375">count 값"을 캡처</text>
  <rect x="80" y="208" width="220" height="42" rx="6" fill="#ffffff" stroke="#e5e4e7"/>
  <text x="190" y="234" text-anchor="middle" font-size="11" font-family="ui-monospace, monospace" fill="#08060d">"3초 동안 3번 클릭!"</text>
  <text x="190" y="262" text-anchor="middle" font-size="9.5" fill="#6b6375">그 사이 더 눌러도 이 값은 안 바뀜</text>

  <!-- ref box -->
  <rect x="380" y="120" width="260" height="150" rx="10" fill="#f4f3ec" stroke="#aa3bff" stroke-width="1.5"/>
  <text x="510" y="146" text-anchor="middle" font-size="12" fill="#aa3bff" font-weight="700">ref (refVal.current)</text>
  <text x="510" y="176" text-anchor="middle" font-size="10.5" fill="#6b6375">객체 자체를 참조 -</text>
  <text x="510" y="192" text-anchor="middle" font-size="10.5" fill="#6b6375">"지금 이 순간의 current" 읽음</text>
  <rect x="400" y="208" width="220" height="42" rx="6" fill="#ffffff" stroke="#aa3bff" stroke-width="1.5"/>
  <text x="510" y="234" text-anchor="middle" font-size="11" font-family="ui-monospace, monospace" fill="#08060d">"3초 동안 N번 클릭!"</text>
  <text x="510" y="262" text-anchor="middle" font-size="9.5" fill="#aa3bff" font-weight="600">실행되는 순간의 최신값</text>
</svg>
