<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <rect width="700" height="300" fill="#ffffff"/>
  <text x="350" y="26" text-anchor="middle" font-size="14" fill="#08060d" font-weight="600">[...list]는 배열만 복사한다 - 안의 객체는 여전히 같은 걸 가리킨다</text>

  <!-- original array -->
  <text x="140" y="60" text-anchor="middle" font-size="11.5" fill="#6b6375" font-weight="600">list (원본 배열)</text>
  <rect x="60" y="70" width="160" height="40" rx="6" fill="#f4f3ec" stroke="#e5e4e7"/>
  <text x="140" y="94" text-anchor="middle" font-size="10" font-family="ui-monospace, monospace" fill="#08060d">[obj1, obj2, obj3]</text>

  <!-- new array -->
  <text x="560" y="60" text-anchor="middle" font-size="11.5" fill="#aa3bff" font-weight="600">new_arr (복사된 배열)</text>
  <rect x="480" y="70" width="160" height="40" rx="6" fill="#f4f3ec" stroke="#aa3bff" stroke-width="1.5"/>
  <text x="560" y="94" text-anchor="middle" font-size="10" font-family="ui-monospace, monospace" fill="#08060d">[obj1, obj2, obj3]</text>

  <text x="350" y="95" text-anchor="middle" font-size="10" fill="#6b6375">← 배열 껍데기는 서로 다름 (새 참조)</text>

  <!-- shared objects -->
  <rect x="220" y="150" width="120" height="50" rx="8" fill="#ffffff" stroke="#aa3bff" stroke-width="2"/>
  <text x="280" y="172" text-anchor="middle" font-size="10.5" fill="#08060d" font-weight="700">obj2</text>
  <text x="280" y="188" text-anchor="middle" font-size="9.5" fill="#6b6375">{"{id:2, done:false}"}</text>

  <line x1="150" y1="110" x2="270" y2="150" stroke="#6b6375" stroke-width="1.3"/>
  <line x1="600" y1="110" x2="300" y2="150" stroke="#aa3bff" stroke-width="1.3"/>

  <text x="280" y="225" text-anchor="middle" font-size="11" fill="#aa3bff" font-weight="700">둘 다 같은 객체를 가리킴!</text>
  <rect x="140" y="240" width="280" height="46" rx="6" fill="#f4f3ec" stroke="#aa3bff" stroke-width="1.5"/>
  <text x="280" y="260" text-anchor="middle" font-size="10" font-family="ui-monospace, monospace" fill="#08060d">new_arr[i].done = !list[i].done</text>
  <text x="280" y="276" text-anchor="middle" font-size="9.5" fill="#aa3bff" font-weight="600">→ 원본 list의 obj2.done도 같이 바뀜</text>
</svg>
