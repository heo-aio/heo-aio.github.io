<svg viewBox="0 0 900 540" xmlns="http://www.w3.org/2000/svg" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">
  <rect x="0" y="0" width="900" height="540" fill="#F9FAFB"/>
  <text x="30" y="36" font-size="17" font-weight="700" fill="#1F2937">프로세스 상태 전이 - 무엇이 그 전이를 일으키는가</text>

  <!-- New -->
  <rect x="40" y="210" width="130" height="70" rx="10" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
  <text x="105" y="252" font-size="14" font-weight="700" fill="#374151" text-anchor="middle">New</text>

  <!-- Ready -->
  <rect x="280" y="210" width="130" height="70" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
  <text x="345" y="252" font-size="14" font-weight="700" fill="#3730A3" text-anchor="middle">Ready</text>

  <!-- Running -->
  <rect x="520" y="210" width="130" height="70" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  <text x="585" y="252" font-size="14" font-weight="700" fill="#065F46" text-anchor="middle">Running</text>

  <!-- Terminated -->
  <rect x="760" y="210" width="110" height="70" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="2"/>
  <text x="815" y="252" font-size="13.5" font-weight="700" fill="#991B1B" text-anchor="middle">Terminated</text>

  <!-- Waiting (아래, Ready와 Running 사이 폭에 맞춤) -->
  <rect x="395" y="380" width="150" height="70" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
  <text x="470" y="422" font-size="14" font-weight="700" fill="#92400E" text-anchor="middle">Waiting</text>

  <!-- New -> Ready -->
  <path d="M 170 245 L 275 245" stroke="#374151" stroke-width="2" marker-end="url(#a10)"/>
  <text x="222" y="233" font-size="12" fill="#374151" font-weight="700" text-anchor="middle">admitted</text>

  <!-- Ready -> Running (dispatch) -->
  <path d="M 410 235 L 515 235" stroke="#059669" stroke-width="2" marker-end="url(#a10)"/>
  <text x="462" y="223" font-size="12" fill="#059669" font-weight="700" text-anchor="middle">dispatch</text>

  <!-- Running -> Ready (timeout) -->
  <path d="M 515 265 L 410 265" stroke="#D97706" stroke-width="2" marker-end="url(#a10)"/>
  <text x="462" y="285" font-size="12" fill="#D97706" font-weight="700" text-anchor="middle">timeout</text>

  <!-- Running -> Terminated (exit) -->
  <path d="M 650 245 L 755 245" stroke="#DC2626" stroke-width="2" marker-end="url(#a10)"/>
  <text x="702" y="233" font-size="12" fill="#DC2626" font-weight="700" text-anchor="middle">exit</text>

  <!-- Running -> Waiting (I/O 요청) : 오른쪽 곡선 -->
  <path d="M 555 280 C 575 320, 560 355, 535 378" fill="none" stroke="#D97706" stroke-width="2" marker-end="url(#a10)"/>
  <text x="590" y="335" font-size="12" fill="#D97706" font-weight="700">I/O 요청</text>

  <!-- Waiting -> Ready (I/O 완료) : 왼쪽 곡선, 반드시 Ready로만 복귀 -->
  <path d="M 410 378 C 390 350, 385 315, 375 285" fill="none" stroke="#4F46E5" stroke-width="2" marker-end="url(#a10)"/>
  <text x="270" y="335" font-size="12" fill="#4F46E5" font-weight="700">I/O 완료</text>

  <!-- 범례 -->
  <rect x="40" y="470" width="820" height="55" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="58" y="491" font-size="11.5" fill="#374151">admitted = 메모리 확보 완료 · dispatch = 스케줄러가 CPU 배정 · timeout = 할당시간 초과/인터럽트</text>
  <text x="58" y="512" font-size="11.5" fill="#374151" font-weight="700">핵심: I/O 완료 후에는 곧바로 Running이 아니라 반드시 Ready를 거쳐야 CPU를 다시 받는다</text>

  <defs>
    <marker id="a10" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#374151"/></marker>
  </defs>
</svg>
