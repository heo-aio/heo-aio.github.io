<svg viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg" font-family="'Pretendard','Malgun Gothic',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="900" height="480" fill="#fafafa"/>

  <!-- Title -->
  <text x="450" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#222">AutoModel vs AutoModelForXXX</text>

  <!-- Input -->
  <rect x="360" y="60" width="180" height="44" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="450" y="87" text-anchor="middle" font-size="14" fill="#3730a3">입력 문장</text>

  <!-- Arrow to backbone -->
  <line x1="450" y1="104" x2="450" y2="140" stroke="#999" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Backbone box -->
  <rect x="260" y="144" width="380" height="90" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="450" y="180" text-anchor="middle" font-size="16" font-weight="700" fill="#075985">백본 (Backbone)</text>
  <text x="450" y="205" text-anchor="middle" font-size="12.5" fill="#075985">BERT / GPT 본체 · 파라미터 대부분 여기</text>

  <!-- Arrow down to fork -->
  <line x1="450" y1="234" x2="450" y2="262" stroke="#999" stroke-width="2"/>

  <!-- Fork lines -->
  <line x1="450" y1="262" x2="200" y2="262" stroke="#999" stroke-width="2"/>
  <line x1="450" y1="262" x2="700" y2="262" stroke="#999" stroke-width="2"/>
  <line x1="200" y1="262" x2="200" y2="290" stroke="#999" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="700" y1="262" x2="700" y2="290" stroke="#999" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- AutoModel branch -->
  <rect x="60" y="294" width="280" height="86" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="200" y="322" text-anchor="middle" font-size="14.5" font-weight="700" fill="#334155">AutoModel</text>
  <text x="200" y="344" text-anchor="middle" font-size="12" fill="#475569">헤드 없음 → hidden_states만 반환</text>
  <text x="200" y="362" text-anchor="middle" font-size="12" fill="#475569">(사람이 읽을 수 있는 결과 아님)</text>

  <!-- AutoModelForXXX branch -->
  <rect x="560" y="294" width="280" height="86" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="700" y="322" text-anchor="middle" font-size="14.5" font-weight="700" fill="#991b1b">AutoModelForXXX</text>
  <text x="700" y="344" text-anchor="middle" font-size="12" fill="#7f1d1d">백본 + 태스크 전용 헤드(Linear)</text>
  <text x="700" y="362" text-anchor="middle" font-size="12" fill="#7f1d1d">→ 분류/생성 등 최종 결과 반환</text>

  <!-- Bottom outputs -->
  <line x1="200" y1="380" x2="200" y2="412" stroke="#999" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="700" y1="380" x2="700" y2="412" stroke="#999" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="70" y="414" width="260" height="46" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.3"/>
  <text x="200" y="442" text-anchor="middle" font-size="12.5" fill="#334155">[배치, 토큰수, 768] 벡터</text>

  <rect x="570" y="414" width="260" height="46" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.3"/>
  <text x="700" y="442" text-anchor="middle" font-size="12.5" fill="#991b1b">라벨 확률 / 다음 토큰 등</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#999"/>
    </marker>
  </defs>
</svg>
