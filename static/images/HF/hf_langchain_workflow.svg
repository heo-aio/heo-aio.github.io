<svg viewBox="0 0 940 300" xmlns="http://www.w3.org/2000/svg" font-family="'Pretendard','Malgun Gothic',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="940" height="300" fill="#fafafa"/>
  <text x="470" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#222">실무 플로우 예시 - 세 기술이 이어지는 지점</text>

  <rect x="30" y="70" width="270" height="130" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="165" y="98" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3730a3">1. Transformers</text>
  <text x="165" y="122" text-anchor="middle" font-size="11.5" fill="#3730a3">베이스 모델(EXAONE, Gemma 등)을</text>
  <text x="165" y="140" text-anchor="middle" font-size="11.5" fill="#3730a3">내 데이터로 파인튜닝</text>
  <text x="165" y="168" text-anchor="middle" font-size="10.5" fill="#4338ca" font-family="monospace">AutoModelForCausalLM</text>
  <text x="165" y="184" text-anchor="middle" font-size="10.5" fill="#4338ca" font-family="monospace">+ Trainer / LoRA</text>

  <line x1="300" y1="135" x2="336" y2="135" stroke="#999" stroke-width="2.2" marker-end="url(#q)"/>

  <rect x="340" y="70" width="270" height="130" rx="12" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="475" y="98" text-anchor="middle" font-size="13.5" font-weight="700" fill="#713f12">2. Ollama / vLLM</text>
  <text x="475" y="122" text-anchor="middle" font-size="11.5" fill="#713f12">파인튜닝한 모델을</text>
  <text x="475" y="140" text-anchor="middle" font-size="11.5" fill="#713f12">추론 엔진에 마운트</text>
  <text x="475" y="168" text-anchor="middle" font-size="10.5" fill="#854d0e">→ API 형태로 서빙 가능해짐</text>

  <line x1="610" y1="135" x2="646" y2="135" stroke="#999" stroke-width="2.2" marker-end="url(#q)"/>

  <rect x="650" y="70" width="260" height="130" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="780" y="98" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f46">3. LangChain</text>
  <text x="780" y="122" text-anchor="middle" font-size="11.5" fill="#065f46">ChatOllama 등으로 접근해</text>
  <text x="780" y="140" text-anchor="middle" font-size="11.5" fill="#065f46">RAG·대화기록 등 조립</text>
  <text x="780" y="168" text-anchor="middle" font-size="10.5" fill="#047857">→ 최종 서비스 앱 완성</text>

  <rect x="30" y="220" width="880" height="56" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="470" y="244" text-anchor="middle" font-size="12" fill="#334155">작업 성격/목적에 따라 특정 단계는 생략되거나 다른 팀이 맡을 수 있음</text>
  <text x="470" y="262" text-anchor="middle" font-size="12" fill="#334155">(예: 파인튜닝 없이 기존 모델 + LangChain만 쓰는 경우도 흔함)</text>

  <defs>
    <marker id="q" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#999"/></marker>
  </defs>
</svg>
