<svg viewBox="0 0 900 460" xmlns="http://www.w3.org/2000/svg" font-family="'Pretendard','Malgun Gothic',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="900" height="460" fill="#fafafa"/>
  <text x="450" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#222">last_hidden_state vs pooler_output</text>

  <!-- Sentence tokens -->
  <text x="60" y="88" font-size="13" fill="#555">입력: "[CLS] 파이썬 이라는 언어 는 참 재미있습니다 [SEP]"</text>

  <!-- Token boxes -->
  <g id="tokens">
    <!-- 8 tokens -->
    <rect x="60"  y="104" width="88" height="42" rx="6" fill="#fde68a" stroke="#b45309" stroke-width="1.5"/>
    <text x="104" y="130" text-anchor="middle" font-size="12" fill="#78350f">[CLS]</text>

    <rect x="156" y="104" width="88" height="42" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.3"/>
    <text x="200" y="130" text-anchor="middle" font-size="12" fill="#1e3a8a">파이썬</text>

    <rect x="252" y="104" width="88" height="42" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.3"/>
    <text x="296" y="130" text-anchor="middle" font-size="12" fill="#1e3a8a">이라는</text>

    <rect x="348" y="104" width="88" height="42" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.3"/>
    <text x="392" y="130" text-anchor="middle" font-size="12" fill="#1e3a8a">언어</text>

    <rect x="444" y="104" width="88" height="42" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.3"/>
    <text x="488" y="130" text-anchor="middle" font-size="12" fill="#1e3a8a">는</text>

    <rect x="540" y="104" width="88" height="42" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.3"/>
    <text x="584" y="130" text-anchor="middle" font-size="12" fill="#1e3a8a">참</text>

    <rect x="636" y="104" width="88" height="42" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.3"/>
    <text x="680" y="130" text-anchor="middle" font-size="12" fill="#1e3a8a">재미있습니다</text>

    <rect x="732" y="104" width="88" height="42" rx="6" fill="#fde68a" stroke="#b45309" stroke-width="1.5"/>
    <text x="776" y="130" text-anchor="middle" font-size="12" fill="#78350f">[SEP]</text>
  </g>

  <!-- Arrow down -->
  <line x1="440" y1="146" x2="440" y2="176" stroke="#999" stroke-width="2" marker-end="url(#arrow2)"/>
  <text x="450" y="168" font-size="11.5" fill="#777">BERT 통과</text>

  <!-- hidden_states row -->
  <text x="60" y="200" font-size="13.5" font-weight="700" fill="#0369a1">last_hidden_state → [1, 8, 768]</text>
  <g>
    <rect x="60"  y="210" width="88" height="34" rx="6" fill="#bae6fd" stroke="#0284c7" stroke-width="1.3"/>
    <rect x="156" y="210" width="88" height="34" rx="6" fill="#bae6fd" stroke="#0284c7" stroke-width="1.3"/>
    <rect x="252" y="210" width="88" height="34" rx="6" fill="#bae6fd" stroke="#0284c7" stroke-width="1.3"/>
    <rect x="348" y="210" width="88" height="34" rx="6" fill="#bae6fd" stroke="#0284c7" stroke-width="1.3"/>
    <rect x="444" y="210" width="88" height="34" rx="6" fill="#bae6fd" stroke="#0284c7" stroke-width="1.3"/>
    <rect x="540" y="210" width="88" height="34" rx="6" fill="#bae6fd" stroke="#0284c7" stroke-width="1.3"/>
    <rect x="636" y="210" width="88" height="34" rx="6" fill="#bae6fd" stroke="#0284c7" stroke-width="1.3"/>
    <rect x="732" y="210" width="88" height="34" rx="6" fill="#bae6fd" stroke="#0284c7" stroke-width="1.3"/>
  </g>
  <text x="450" y="266" text-anchor="middle" font-size="12" fill="#0c4a6e">→ 토큰마다 768차원 벡터 (총 8개) : 토큰 단위 작업(NER 등)에 사용</text>

  <!-- Arrow down to pooler -->
  <line x1="104" y1="244" x2="104" y2="300" stroke="#b45309" stroke-width="2.2" marker-end="url(#arrow3)"/>
  <text x="130" y="285" font-size="11.5" fill="#92400e">[CLS] 벡터만 추출 + Linear + Tanh</text>

  <!-- pooler_output box -->
  <rect x="34" y="304" width="140" height="56" rx="8" fill="#fde68a" stroke="#b45309" stroke-width="2"/>
  <text x="104" y="337" text-anchor="middle" font-size="13" font-weight="700" fill="#78350f">pooler_output</text>

  <text x="230" y="336" font-size="13" fill="#78350f">[1, 768] — 문장 전체를 대표하는 벡터 1개</text>
  <text x="230" y="356" font-size="12" fill="#92400e">→ 문장 단위 작업(분류 등)에 전통적으로 사용</text>

  <!-- Bottom note -->
  <rect x="60" y="392" width="760" height="48" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="440" y="413" text-anchor="middle" font-size="12.5" fill="#334155">실무 팁: 요즘은 pooler_output보다 hidden_states를 평균 내는</text>
  <text x="440" y="430" text-anchor="middle" font-size="12.5" fill="#334155">mean pooling 방식을 문장 임베딩에 더 많이 씁니다 (Sentence-BERT 등)</text>

  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#999"/></marker>
    <marker id="arrow3" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#b45309"/></marker>
  </defs>
</svg>
