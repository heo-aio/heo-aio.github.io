<svg viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" font-family="'Pretendard','Malgun Gothic',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="900" height="420" fill="#fafafa"/>
  <text x="450" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#222">generate() = forward()를 반복하는 자기회귀 루프</text>

  <!-- Step boxes -->
  <rect x="40" y="70" width="200" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.6"/>
  <text x="140" y="98" text-anchor="middle" font-size="13" font-weight="700" fill="#3730a3">입력</text>
  <text x="140" y="118" text-anchor="middle" font-size="12" fill="#3730a3">"오늘 날씨는"</text>

  <line x1="240" y1="105" x2="280" y2="105" stroke="#999" stroke-width="2" marker-end="url(#a)"/>

  <rect x="284" y="70" width="220" height="70" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.8"/>
  <text x="394" y="98" text-anchor="middle" font-size="13" font-weight="700" fill="#075985">forward()</text>
  <text x="394" y="118" text-anchor="middle" font-size="11.5" fill="#075985">logits 계산 (다음 토큰 점수)</text>

  <line x1="504" y1="105" x2="544" y2="105" stroke="#999" stroke-width="2" marker-end="url(#a)"/>

  <rect x="548" y="70" width="200" height="70" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.8"/>
  <text x="648" y="98" text-anchor="middle" font-size="13" font-weight="700" fill="#713f12">softmax + 샘플링</text>
  <text x="648" y="118" text-anchor="middle" font-size="11.5" fill="#713f12">다음 토큰 1개 선택</text>

  <!-- down arrow -->
  <line x1="648" y1="140" x2="648" y2="176" stroke="#999" stroke-width="2" marker-end="url(#a)"/>

  <rect x="548" y="180" width="200" height="60" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="648" y="207" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">선택된 토큰</text>
  <text x="648" y="226" text-anchor="middle" font-size="12" fill="#991b1b">예: "좋"</text>

  <!-- loop back arrow -->
  <path d="M 548 210 C 300 260, 200 180, 140 140" fill="none" stroke="#16a34a" stroke-width="2.2" marker-end="url(#g)"/>
  <text x="330" y="270" text-anchor="middle" font-size="12.5" fill="#15803d" font-weight="700">입력에 이어붙여서 다시 forward() 호출</text>
  <text x="330" y="288" text-anchor="middle" font-size="11.5" fill="#166534">("오늘 날씨는 좋" → 다음 토큰 예측 반복)</text>

  <!-- max_new_tokens box -->
  <rect x="548" y="260" width="200" height="60" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/>
  <text x="648" y="284" text-anchor="middle" font-size="12" fill="#334155">max_new_tokens만큼</text>
  <text x="648" y="302" text-anchor="middle" font-size="12" fill="#334155">또는 종료토큰까지 반복</text>
  <line x1="648" y1="240" x2="648" y2="256" stroke="#999" stroke-width="2" marker-end="url(#a)"/>

  <!-- final output -->
  <rect x="330" y="350" width="380" height="50" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
  <text x="520" y="380" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">"오늘 날씨는 좋다" (완성된 문장 = 답변)</text>
  <line x1="648" y1="320" x2="520" y2="350" stroke="#999" stroke-width="2" marker-end="url(#a)"/>

  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#999"/></marker>
    <marker id="g" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#16a34a"/></marker>
  </defs>
</svg>
